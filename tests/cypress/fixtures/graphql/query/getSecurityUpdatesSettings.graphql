query getSecurityUpdatesSettings {
    securityUpdates {
        settings {
            enabled
            refreshIntervalHours
            useForgeSettings
            defaultStoreUrl
            extraFeedUrls
            bannerEnabled
            bannerMinimumSeverity
            bannerIncludeOwnerReports
            bannerBackgroundColor
            bannerTextColor
            bannerDismissPolicy
            bannerDismissHours
            contrastRatio
        }
    }
}
