mutation updateSecurityUpdatesSettings($input: InputSecurityUpdatesSettingsValues!) {
    securityUpdates {
        updateSettings(input: $input) {
            ok
            errors {
                field
                code
                message
                suggestions {
                    field
                    value
                    ratio
                }
            }
            settings {
                refreshIntervalHours
                bannerBackgroundColor
                bannerTextColor
                bannerDismissPolicy
            }
        }
    }
}
