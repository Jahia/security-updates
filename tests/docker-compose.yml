services:
    jahia:
        image: '${JAHIA_IMAGE}'
        container_name: jahia
        depends_on:
            storefixture-tls:
                condition: service_completed_successfully
        ports:
            - '8080:8080'
            # JDWP (JPDA=true): local debugging only, never on the other interfaces of the host.
            - '127.0.0.1:8000:8000'
        environment:
            - SUPER_USER_PASSWORD=${SUPER_USER_PASSWORD}
            - JAHIA_LICENSE=${JAHIA_LICENSE}
            - JPDA=true
            # Jahia's HTTP client refuses internal addresses (SSRF guard). Allow the fixture store, which a customer
            # does the same way for a private store: jahia.httpClient.allowedInternalHosts.
            - jahia_cfg_jahia_httpClient_allowedInternalHosts=storefixture
            # The module only reads https stores. The JVM trusts the TEST-ONLY certificate of the fixture store
            # through a truststore made of the JDK cacerts of this image plus that certificate (generate-tls.sh).
            # The image appends CATALINA_OPTS to its own JVM options (tomcat/bin/setenv.sh, entrypoint.sh).
            - CATALINA_OPTS=-Djavax.net.ssl.trustStore=/srv/storefixture/trust/truststore.p12 -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword=changeit
        volumes:
            - storefixture-generated:/srv/storefixture:ro
        extra_hosts:
            - jahia:127.0.0.1
        networks:
            - stack
    # TEST-ONLY: creates the self-signed certificate of the fixture store (SAN storefixture), the truststore of the
    # Jahia JVM and the files nginx serves, in the storefixture-generated volume, then exits (see generate-tls.sh).
    # It uses the Jahia image for its openssl and its JDK cacerts.
    storefixture-tls:
        image: '${JAHIA_IMAGE}'
        container_name: storefixture-tls
        user: root
        entrypoint: ['/bin/sh', '/storefixture-src/generate-tls.sh']
        volumes:
            - ./storefixture:/storefixture-src:ro
            - storefixture-generated:/srv/storefixture
        networks:
            - stack
    # A store that serves fixed moduleList.json and securityUpdates.json over https (tests/storefixture/contents),
    # so that the findings depend neither on what store.jahia.com publishes nor on internet access from the test
    # network. Port 80 serves a different feed, as a trap: the module must never read a plain http store.
    storefixture:
        image: 'nginx:1.27.5-alpine'
        container_name: storefixture
        depends_on:
            storefixture-tls:
                condition: service_completed_successfully
        volumes:
            - ./storefixture/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - storefixture-generated:/srv/storefixture:ro
        networks:
            - stack
    # Cypress container
    cypress:
        image: '${TESTS_IMAGE}'
        # https://github.com/cypress-io/cypress/issues/350
        ipc: host
        container_name: cypress
        depends_on:
            - jahia
            - storefixture
        environment:
            - MANIFEST=${MANIFEST}
            - SUPER_USER_PASSWORD=${SUPER_USER_PASSWORD}
            - JAHIA_URL=http://jahia:8080
            - NEXUS_USERNAME=${NEXUS_USERNAME}
            - NEXUS_PASSWORD=${NEXUS_PASSWORD}
        networks:
            - stack
networks:
    stack:
volumes:
    # Generated TEST-ONLY TLS material and fixture files; removed with "docker compose down -v".
    storefixture-generated:
