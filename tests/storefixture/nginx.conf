# TEST-ONLY store served to the Jahia of the e2e tests (see generate-tls.sh and docker-compose.yml).

# "1" while the switch of the "flaky" store is "fail" (switches.js, loaded by nginx-main.conf).
js_set $flaky_failing switches.flakyFailing;

# The fixture store, over https with a certificate generated for the host name "storefixture".
server {
    listen 443 ssl;
    server_name storefixture;

    ssl_certificate     /srv/storefixture/tls/storefixture.crt;
    ssl_certificate_key /srv/storefixture/tls/storefixture.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /srv/storefixture/https;
    default_type application/json;

    location / {
        try_files $uri =404;
    }

    # Stores that fail, for 08-securityUpdates-StoreErrors.cy.ts. A store at the base URL https://storefixture/<name>
    # is read at <name>/contents/modules-repository.securityUpdates.json and .moduleList.json. Their feeds are in
    # tests/storefixture/stores/<name>/contents/; their module list is the one of the fixture store.

    # A store that publishes no security feed (HTTP 404): NOT_PUBLISHED.
    location ^~ /not-published/ {
        return 404;
    }

    # schema-v2: a feed of schemaVersion 2 (NOT_UNDERSTOOD / SCHEMA_UNSUPPORTED).
    # introduced-version: an advisory whose introducedVersion is above the installed version, and its twin without.
    location ~ ^/(schema-v2|introduced-version)/contents/modules-repository\.moduleList\.json$ {
        rewrite ^ /contents/modules-repository.moduleList.json last;
    }

    # flaky: the fixture store while the switch (port 8081) is "ok", HTTP 500 while it is "fail".
    location ^~ /flaky/contents/ {
        if ($flaky_failing = 1) {
            return 500;
        }
        rewrite ^/flaky(/contents/.*)$ $1 last;
    }
}

# TEST-ONLY switch of the "flaky" store (switches.js), for the specs in the test network only (port not published):
# POST /switch/flaky?state=fail, then ?state=ok, on port 8081 of storefixture.
server {
    listen 8081;
    server_name storefixture;
    default_type text/plain;

    location = /switch/flaky {
        js_content switches.setFlaky;
    }

    location / {
        return 404;
    }
}

# A trap for plain http: it serves a different feed (advisory JSA-2099-0666). The module refuses http stores
# (error detail NOT_HTTPS) and never fetches them, so that advisory must never appear in a report.
server {
    listen 80;
    server_name storefixture;

    root /srv/storefixture/http-trap;
    default_type application/json;

    location / {
        try_files $uri =404;
    }
}
