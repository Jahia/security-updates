# TEST-ONLY main configuration of the fixture store (see nginx.conf for its servers). It is the one of the nginx
# image plus njs, which keeps the state of the "flaky" store (switches.js) in a zone shared by the workers.
load_module modules/ngx_http_js_module.so;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /var/log/nginx/access.log;

    sendfile           on;
    keepalive_timeout  65;

    js_path              /etc/nginx/njs/;
    js_import            switches from switches.js;
    js_shared_dict_zone  zone=switches:64k;

    include /etc/nginx/conf.d/*.conf;
}
