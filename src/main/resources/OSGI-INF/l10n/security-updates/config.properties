configName=Security updates
configDesc=Checks the Jahia Store security feed against the installed Jahia core and modules
enabled=Enabled
enabled.desc=Check the stores for security updates
refreshIntervalHours=Refresh interval (hours)
refreshIntervalHours.desc=Hours between two scheduled checks, from 1 to 720
useForgeSettings=Use the module manager stores
useForgeSettings.desc=Check the stores configured in the module manager, with their credentials (https stores only)
extraFeedUrls=Extra feed URLs
extraFeedUrls.desc=Full URLs of additional security feeds, separated by commas or spaces: at most 10 absolute https URLs, no credentials, query or fragment
defaultStoreUrl=Default store URL
defaultStoreUrl.desc=Absolute https base URL of the store checked when no store is configured in the module manager (or when the module manager stores are not used); empty for none
bannerEnabled=Show the banner
bannerEnabled.desc=Show a banner in the Jahia UI to users with the adminTemplates permission when security updates apply
bannerMinimumSeverity=Banner minimum severity
bannerMinimumSeverity.desc=Lowest severity counted by the banner
bannerIncludeOwnerReports=Banner counts owner reports
bannerIncludeOwnerReports.desc=Count the findings reported by module owners in the banner, not only Jahia advisories
severity.LOW=Low
severity.MEDIUM=Medium
severity.HIGH=High
severity.CRITICAL=Critical
bannerBackgroundColor=Banner background colour
bannerBackgroundColor.desc=#RRGGBB; the contrast ratio with the text colour must be at least 7:1
bannerTextColor=Banner text colour
bannerTextColor.desc=#RRGGBB; the contrast ratio with the background colour must be at least 7:1
bannerDismissPolicy=Banner dismissal
bannerDismissPolicy.desc=How long a dismissed banner stays hidden; it comes back when a new advisory is counted
bannerDismissHours=Banner dismissal duration (hours)
bannerDismissHours.desc=Hours a dismissal lasts with the "For a number of hours" policy, from 1 to 720
dismiss.SESSION=Until the browser tab is closed
dismiss.HOURS=For a number of hours
dismiss.UNTIL_CHANGE=Until a new advisory is counted
dismiss.NEVER=Cannot be dismissed
onDemandMinIntervalSeconds=Minimum interval between on-demand checks (seconds)
onDemandMinIntervalSeconds.desc=Seconds between the starts of two checks run with "Check now", from 0 to 3600; not shown in the settings page
