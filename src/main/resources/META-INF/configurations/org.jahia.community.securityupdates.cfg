# default configuration - won't be overridden

# Security updates - checks the Jahia Store security feed against the installed components.

# Set to false to stop checking the stores (the admin page then reports "disabled").
enabled=true

# Hours between two scheduled checks (1 to 720). The first check runs about one minute after startup.
refreshIntervalHours=24

# true: check the stores configured in the module manager (/settings/forgesSettings), with their credentials.
# false: check only defaultStoreUrl.
useForgeSettings=true

# Comma-separated full URLs of additional security feeds (schemaVersion 1 JSON documents, absolute
# http(s) URLs, no credentials). Empty by default.
extraFeedUrls=

# Store checked when no store is configured in the module manager (or when useForgeSettings=false).
defaultStoreUrl=https://store.jahia.com
