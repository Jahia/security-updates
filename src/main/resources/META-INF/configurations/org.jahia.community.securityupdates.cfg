# default configuration - won't be overridden

# Security updates - checks the security feed of the stores against the installed components.

# Set to false to stop checking the stores (the admin page then reports "disabled").
enabled=true

# Hours between two scheduled checks (1 to 720; a value out of range is clamped, with a warning). The first check
# runs about one minute after startup, and again about one minute after a change of the check settings.
refreshIntervalHours=24

# true: check the stores configured in the module manager, with their credentials (https stores only; a plain
#       http store is reported and not checked).
# false: check only defaultStoreUrl.
useForgeSettings=true

# Full URLs of additional security feeds (schemaVersion 1 JSON documents), separated by commas or spaces:
# at most 10 absolute https URLs (plain http is refused), without credentials, query or fragment. Empty by default.
extraFeedUrls=

# Absolute https base URL of the store checked only when the module manager holds no store (or when
# useForgeSettings=false); the module reads <url>/contents/modules-repository.securityUpdates.json. Empty for none.
# On a standard Jahia the module manager store is read instead, so this value is not used.
# To read only your own feed: useForgeSettings=false, defaultStoreUrl empty, the feed in extraFeedUrls.
defaultStoreUrl=https://store.jahia.com

# Banner shown in the Jahia UI to users who have the adminTemplates permission.
# false: never show it (the Security updates page is not affected).
bannerEnabled=true

# Lowest severity that the banner counts: LOW, MEDIUM, HIGH or CRITICAL. Any other value means HIGH (with a warning).
bannerMinimumSeverity=HIGH

# true: findings reported by module owners count too; false: only Jahia advisories count.
bannerIncludeOwnerReports=true

# Colours of the banner, #RRGGBB. The pair must have a contrast ratio of at least 7:1 (WCAG 2.2 AAA);
# an invalid colour or a lower contrast means the default pair, with a warning.
bannerBackgroundColor=#1B1B1B
bannerTextColor=#FFFFFF

# How long a dismissed banner stays hidden:
#   SESSION       until the browser tab is closed
#   HOURS         for bannerDismissHours hours (stored in the browser, per Jahia user)
#   UNTIL_CHANGE  until a new advisory or a new component is counted (stored in the browser, per Jahia user)
#   NEVER         the banner cannot be dismissed
# Except with NEVER, the banner comes back as soon as a new advisory or a new component is counted. Any other value means SESSION.
bannerDismissPolicy=SESSION

# Hours a dismissal lasts with bannerDismissPolicy=HOURS (1 to 720).
bannerDismissHours=24

# Seconds between two checks run with "Check now" (0 to 3600), counted from the later of the start and the end
# of the previous check. Not shown in the settings page.
onDemandMinIntervalSeconds=30
